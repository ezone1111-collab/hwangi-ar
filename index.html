function stickerSVG(id, mode=MODE){
  const bgc = mode==='cacao' ? CFG.INK : CFG.YELLOW, fgc = mode==='cacao' ? CFG.YELLOW : CFG.INK;   // Yellow = 노란 배경+카카오 그래픽 / Cacao = 반대
  const d=STKD[id]; if(d) return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${d.vb}"><g fill="${bgc}">${d.bg}</g><g fill="${fgc}" fill-rule="evenodd">${d.fg}</g></svg>`;
  return stickerSVG0(id,bgc,fgc); }
function stickerSVG0(id,bgc,fgc){ // 파일이 없는 그래픽: 둥근 배경 + 그래픽
  const [cx,cy]=centroid(id), k=.72;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 -500 1000 1000"><path fill="${bgc}" d="${STK_BG}"/><g transform="translate(${(-cx*k).toFixed(1)} ${(-cy*k).toFixed(1)}) scale(${k})" fill="${fgc}" fill-rule="evenodd"><path d="${SH[id].d}"/></g></svg>`; }
let STK=null; // [{id,x,y,s,el}]
const STK_SCALE=1.2;   // 스티커 크기 = 앞 화면 그래픽 한 칸의 1.2배 (배경 포함)
function initStickers(){
  // 앞 화면([11])에서 그래픽이 있던 자리 그대로 스티커로
  const pb=$('pbox').getBoundingClientRect(), cb=$('cbox').getBoundingClientRect();
  const k=Math.min(pb.width/PAT.w, pb.height/PAT.h), ox=pb.left+(pb.width-PAT.w*k)/2-PAT.x*k, oy=pb.top+(pb.height-PAT.h*k)/2-PAT.y*k;
  STK=PAT.cells.map(q=>({id:q.id, x:ox+q.cx*k-cb.left, y:oy+q.cy*k-cb.top, s:1000*k*STK_SCALE}));
  const b=box(); STK.forEach(o=>{ o.x=Math.min(b.w-10,Math.max(10,o.x)); o.y=Math.min(b.h-10,Math.max(10,o.y)); });
  $('stk').innerHTML=''; STK.forEach(o=>{ const el=document.createElement('div'); el.className='st'; el.innerHTML=stickerSVG(o.id)+'<i class="hd"></i>'; o.el=el; $('stk').appendChild(el); place(o); });
}
document.addEventListener('animationend',e=>{ if(e.target.classList&&e.target.classList.contains('pop')) e.target.classList.remove('pop'); });
function place(o){ const t=`translate(${(o.x-o.s/2).toFixed(1)}px,${(o.y-o.s/2).toFixed(1)}px) rotate(${(o.r||0).toFixed(2)}deg)`+(o.dying?' scale(.55)':''); o.el.style.setProperty('--t',t); o.el.style.transform=t; o.el.style.width=o.el.style.height=o.s+'px'; }
let SEL=null; function select(o){ SEL=o; if(o){ $('stk').appendChild(o.el); STK.splice(STK.indexOf(o),1); STK.push(o);} }   // 만진 스티커가 맨 앞으로
// 터치: 인스타 스토리 스티커처럼
//  한 손가락 = 이동 · 두 손가락(두 번째 손가락은 아무 데나) = 크기 + 회전 · 가운데에 오면 맞춤선 (삭제는 없음)
const pts=new Map(); let G=null, moved=false;
const loc=e=>{ const r=$('cbox').getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
const SMIN=40, SMAX=420;
function startG(){ const a=[...pts.values()]; if(!SEL) return;
  G={x:SEL.x,y:SEL.y,s:SEL.s,r:SEL.r||0,a:a.map(p=>p.slice()),
     d:a.length>1?Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]):0, ang:a.length>1?Math.atan2(a[1][1]-a[0][1],a[1][0]-a[0][0]):0}; }
function guides(v,h){ $('gdv').classList.toggle('on',v); $('gdh').classList.toggle('on',h); }
$('cbox').addEventListener('pointerdown',e=>{
  if(e.target.closest('#nocam')) return;
  const el=e.target.closest('.st'); hideHint();
  if(el){ const o=STK.find(s=>s.el===el); if(!pts.size){ select(o); moved=false; } }
  else if(!pts.size||!SEL) return;   // 빈 곳은 두 번째 손가락일 때만
  e.preventDefault(); try{ $('cbox').setPointerCapture(e.pointerId);}catch(_){}
  pts.set(e.pointerId,loc(e)); startG();
});
$('cbox').addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)||!SEL||!G) return; pts.set(e.pointerId,loc(e)); const a=[...pts.values()];
  const bb=box(); let snapV=false, snapH=false;
  if(a.length>1&&G.d&&G.a.length>1){
    const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]), ang=Math.atan2(a[1][1]-a[0][1],a[1][0]-a[0][0]);
    SEL.s=Math.min(SMAX,Math.max(SMIN,G.s*d/G.d));
    let r=G.r+(ang-G.ang)*180/Math.PI; const rn=((r%90)+90)%90; if(rn<3||rn>87) r=Math.round(r/90)*90; SEL.r=r;   // 0°·90° 근처에선 살짝 붙음
    SEL.x=G.x+(a[0][0]+a[1][0])/2-(G.a[0][0]+G.a[1][0])/2; SEL.y=G.y+(a[0][1]+a[1][1])/2-(G.a[0][1]+G.a[1][1])/2; moved=true;
  } else if(a.length===1&&G.a.length===1){
    const dx=a[0][0]-G.a[0][0], dy=a[0][1]-G.a[0][1]; if(Math.hypot(dx,dy)>6) moved=true;
    SEL.x=G.x+dx; SEL.y=G.y+dy;
  }
  if(Math.abs(SEL.x-bb.w/2)<7){ SEL.x=bb.w/2; snapV=true; }
  if(Math.abs(SEL.y-bb.h/2)<7){ SEL.y=bb.h/2; snapH=true; }
  SEL.x=Math.min(bb.w,Math.max(0,SEL.x)); SEL.y=Math.min(bb.h,Math.max(0,SEL.y));
  $('s-cam').classList.toggle('dragging',moved);
  guides(snapV&&moved,snapH&&moved); place(SEL); });
const up=e=>{ if(!pts.has(e.pointerId)) return; const p=pts.get(e.pointerId); pts.delete(e.pointerId);
  if(!pts.size){
    $('s-cam').classList.remove('dragging'); guides(false,false); G=null; return; }
  startG(); };
$('cbox').addEventListener('pointerup',up); $('cbox').addEventListener('pointercancel',up);

/* ---------- 색: Yellow / Cacao ---------- */
let hintT;
function setMode(m){
  MODE=m; document.querySelectorAll('.seg').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  if(STK) STK.forEach(o=>{ o.el.innerHTML=stickerSVG(o.id)+'<i class="hd"></i>'; });
}
function enterCam(){
  go('s-cam'); MODE='yellow'; document.querySelectorAll('.seg').forEach(b=>b.classList.toggle('on',b.dataset.mode==='yellow'));
  requestAnimationFrame(()=>{ if(!STK) initStickers();
    STK.forEach((o,i)=>{ o.el.classList.remove('pop'); o.el.style.opacity=0; setTimeout(()=>{ o.el.style.opacity=''; void o.el.offsetWidth; o.el.classList.add('pop'); },200+i*180); });
    $('hint').classList.remove('hide'); clearTimeout(hintT); hintT=setTimeout(hideHint,5000); });
  startCam();
}
document.querySelectorAll('.seg').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

/* ---------- 카메라 ---------- */
let stream=null;
async function startCam(){
  $('nocam').style.display='none';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ return noCam('이 브라우저에서는 카메라를 열 수 없어요','사파리나 크롬으로 열어주세요'); }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1920}},audio:false});
    const v=$('vid'); v.srcObject=stream; $('pick').hidden=true; v.hidden=false; await v.play().catch(()=>{});
  }catch(e){ noCam('카메라를 열 수 없어요', /NotAllowed|Permission/i.test(e.name)?'카메라 권한을 허용하거나, 사진을 골라주세요':'인스타·카카오톡 안이라면 사파리로 열어주세요'); }
}
function noCam(m,s){ $('nocam').style.display='flex'; $('nc-msg').textContent=m; $('nc-sub').textContent=s; }
$('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const p=$('pick'); p.src=URL.createObjectURL(f); p.hidden=false; $('vid').hidden=true; $('nocam').style.display='none'; });
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

/* ---------- 촬영 ---------- */
function cover(ctx,src,sw,sh,W,H){ const s=Math.max(W/sw,H/sh), dw=sw*s, dh=sh*s; ctx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh); }
let lastBlob=null, lastURL=null;
async function shoot(){
  const bx=box(); const K=Math.max(2,1080/bx.w), W=Math.round(bx.w*K), H=Math.round(bx.h*K); const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#e9e9e9'; x.fillRect(0,0,W,H);
  const v=$('vid'), p=$('pick');
  if(!p.hidden&&p.naturalWidth) cover(x,p,p.naturalWidth,p.naturalHeight,W,H);
  else if(v.videoWidth) cover(x,v,v.videoWidth,v.videoHeight,W,H);
  let svg;
  { svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${bx.w.toFixed(1)} ${bx.h.toFixed(1)}">`+(STK||[]).filter(o=>o.el.style.opacity!=='0').map(o=>`<g transform="rotate(${(o.r||0).toFixed(2)} ${o.x.toFixed(1)} ${o.y.toFixed(1)})">`+stickerSVG(o.id).replace('<svg ',`<svg x="${(o.x-o.s/2).toFixed(1)}" y="${(o.y-o.s/2).toFixed(1)}" width="${o.s.toFixed(1)}" height="${o.s.toFixed(1)}" `)+'</g>').join('')+'</svg>'; }
  try{ const im=await svgImg(svg,W,H); x.drawImage(im,0,0,W,H); }catch(e){ console.warn(e); }
  const f=$('flash'); f.style.transition='none'; f.style.opacity=.85; requestAnimationFrame(()=>{ f.style.transition='opacity .5s'; f.style.opacity=0; });
  // [iPhone 18 Pro - 14] 사진 틀: 카카오색 틀(320.34×554) 안 회색 자리(275.12×475.80)에 사진, 아래에 nooc 로고 → 틀과 함께 저장
  const F=4, FW=Math.round(320.34*F), FH=Math.round(554*F), fc=document.createElement('canvas'); fc.width=FW; fc.height=FH; const fx=fc.getContext('2d');
  const FRC=MODE==='cacao'?CFG.INK:CFG.YELLOW, LGC=MODE==='cacao'?CFG.YELLOW:CFG.INK;   // Yellow: 노란 틀+갈색 로고 / Cacao: 갈색 틀+노란 로고
  fx.fillStyle=FRC; fx.fillRect(0,0,FW,FH);
  const gx=22.61*F, gy=19.79*F, gw=275.12*F, gh=475.80*F, s2=Math.max(gw/W,gh/H);
  fx.save(); fx.beginPath(); fx.rect(gx,gy,gw,gh); fx.clip(); fx.drawImage(c,gx+(gw-W*s2)/2,gy+(gh-H*s2)/2,W*s2,H*s2); fx.restore();
  try{ const lg=await svgImg(FRAME_LOGO.replace(/#FCF1C2/gi,LGC),Math.round(82.18*F),Math.round(21.67*F)); fx.drawImage(lg,118.71*F,512.54*F,82.18*F,21.67*F); }catch(e){ console.warn(e); }
  lastBlob=await new Promise(r=>fc.toBlob(r,'image/jpeg',.93)); if(lastURL) URL.revokeObjectURL(lastURL); lastURL=URL.createObjectURL(lastBlob);
  $('rimg').src=lastURL; $('rbg').src=lastURL;
  setTimeout(()=>{ go('s-res'); stopCam(); },250);
}
$('shutter').addEventListener('click',shoot);
$('b-again').addEventListener('click',()=>{ go('s-cam'); if($('pick').hidden) startCam(); });
$('b-save').addEventListener('click',async()=>{
  if(!lastBlob) return; const name=`nooc-${Date.now()}.jpg`; const file=new File([lastBlob],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=lastURL; a.download=name; document.body.appendChild(a); a.click(); a.remove();
});
$('b-shoot').addEventListener('click',enterCam);

intro();
</script>
