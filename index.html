  const INF=1e20, g=new Float64Array(W*H); for(let i=0;i<W*H;i++) g[i]=inside[i]?INF:0;
  const n=Math.max(W,H), f=new Float64Array(n), d=new Float64Array(n), v=new Int32Array(n), z=new Float64Array(n+1);
  for(let x=0;x<W;x++){ for(let y=0;y<H;y++) f[y]=g[y*W+x]; edt1(f,H,d,v,z); for(let y=0;y<H;y++) g[y*W+x]=d[y]; }
  for(let y=0;y<H;y++){ for(let x=0;x<W;x++) f[x]=g[y*W+x]; edt1(f,W,d,v,z); for(let x=0;x<W;x++) g[y*W+x]=Math.sqrt(d[x]); }
  return g; }
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
// 그라데이션 (영상 프레임에서 뽑은 색): 바깥 회청색 → 모브 → 와인 → 깊은 와인
const STOPS=[[-1.2,'#c9ced1',0],[-.6,'#c4c6c9',.55],[0,'#ad9fa3',1],[.5,'#94606a',1],[1,'#86343d',1],[1.6,'#7d161e',1],[3.5,'#6a1519',1],[6,'#551315',1],[10,'#4b1214',1]];
const LUT_N=512, LUT_A=-1.2, LUT_B=10; const LUT=new Float32Array(LUT_N*4);
for(let i=0;i<LUT_N;i++){ const u=LUT_A+(LUT_B-LUT_A)*i/(LUT_N-1); let j=0; while(j<STOPS.length-2&&u>STOPS[j+1][0]) j++;
  const [u0,c0,a0]=STOPS[j],[u1,c1,a1]=STOPS[j+1]; const f=Math.min(1,Math.max(0,(u-u0)/(u1-u0))); const A=hex(c0),B=hex(c1);
  for(let k=0;k<3;k++) LUT[i*4+k]=A[k]+(B[k]-A[k])*f; LUT[i*4+3]=(a0+(a1-a0)*f)*255; }
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;

async function grow(){
  const box=$('pbox'), cv=$('pcv'); const dpr=Math.min(2.5,devicePixelRatio||1);
  const BW=281,BH=330, W=Math.round(BW*dpr), H=Math.round(BH*dpr); cv.width=W; cv.height=H;
  const im=await svgImg(patSVG('#000'),W,H);
  const m=document.createElement('canvas'); m.width=W; m.height=H; const mx=m.getContext('2d'); mx.drawImage(im,0,0,W,H);
  const a=mx.getImageData(0,0,W,H).data; const ins=new Uint8Array(W*H); for(let i=0;i<W*H;i++) ins[i]=a[i*4+3]>110?1:0;
  const din=edt(ins,W,H);
  // 조각별 최대 두께 (조각마다 가운데부터 차오르게)
  const lab=new Int32Array(W*H).fill(-1), cmax=[]; const stack=new Int32Array(W*H);
  for(let i=0;i<W*H;i++){ if(!ins[i]||lab[i]>=0) continue; const L=cmax.length; let mxv=0, sp=0; stack[sp++]=i; lab[i]=L;
    while(sp){ const p=stack[--sp]; if(din[p]>mxv) mxv=din[p]; const x=p%W, y=(p-x)/W;
      if(x>0&&ins[p-1]&&lab[p-1]<0){lab[p-1]=L;stack[sp++]=p-1} if(x<W-1&&ins[p+1]&&lab[p+1]<0){lab[p+1]=L;stack[sp++]=p+1}
      if(y>0&&ins[p-W]&&lab[p-W]<0){lab[p-W]=L;stack[sp++]=p-W} if(y<H-1&&ins[p+W]&&lab[p+W]<0){lab[p+W]=L;stack[sp++]=p+W} }
    cmax.push(mxv); }
  let n=0; for(let i=0;i<W*H;i++) if(ins[i]) n++;
  const idx=new Int32Array(n), D=new Float32Array(n), CM=new Float32Array(n), DL=new Float32Array(n);
  let y0=H,y1=0; for(let i=0;i<W*H;i++) if(ins[i]){ const y=(i/W)|0; if(y<y0)y0=y; if(y>y1)y1=y; }
  for(let i=0,k=0;i<W*H;i++) if(ins[i]){ idx[k]=i; D[k]=din[i]; CM[k]=cmax[lab[i]]+1; DL[k]=CFG.rise*(1-(((i/W)|0)-y0)/Math.max(1,y1-y0)); k++; }
  // 그라데이션 두께: 칸 크기에 비례
  const fitS=Math.min(W/PAT.w,H/PAT.h); const g=Math.max(1.4*dpr,1000*fitS*.07);
  const ctx=cv.getContext('2d'); const img=ctx.createImageData(W,H); const px=img.data; const ink=hex(CFG.INK);
  const T0=performance.now(), TG=CFG.grow*1000, TS=CFG.solid*1000;
  return new Promise(done=>{
    function frame(now){
      const t=(now-T0)/TG, b=Math.min(1,Math.max(0,(now-T0-TG*.92)/TS));
      for(let k=0;k<n;k++){ const p=Math.min(1,Math.max(0,(t-DL[k])/(1-CFG.rise))); const thr=(1-ease(p))*CM[k];
        const u=(D[k]-thr)/g; const o=idx[k]*4;
        if(u<LUT_A){ px[o+3]=0; continue; }
        const li=Math.min(LUT_N-1,((u-LUT_A)/(LUT_B-LUT_A)*(LUT_N-1))|0)*4;
        px[o]=LUT[li]+(ink[0]-LUT[li])*b; px[o+1]=LUT[li+1]+(ink[1]-LUT[li+1])*b; px[o+2]=LUT[li+2]+(ink[2]-LUT[li+2])*b;
        px[o+3]=u<0?LUT[li+3]*(1-b):LUT[li+3]; }
      ctx.putImageData(img,0,0);
      if(b<1) requestAnimationFrame(frame); else done();
    }
    requestAnimationFrame(frame);
  });
}
// 다 만들어진 뒤: 단색 패턴 + 안쪽 노란 inner shadow
function solidWithGlow(){
  const s=Math.min(281/PAT.w,330/PAT.h); const sd=(CFG.glow.blur/s).toFixed(1);
  const f=`<defs><filter id="ins" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feFlood flood-color="${CFG.glow.color}" flood-opacity="${CFG.glow.opacity}"/><feComposite in2="SourceAlpha" operator="out"/>
    <feGaussianBlur stdDeviation="${sd}"/><feComposite in2="SourceAlpha" operator="in" result="sh"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sh"/></feMerge></filter></defs>`;
  $('psvg').innerHTML=patSVG(CFG.INK).replace('<g fill',f+'<g filter="url(#ins)"><g fill').replace('</g></svg>','</g></g></svg>');
  const sv=$('psvg').firstChild; sv.style.opacity=0;
  requestAnimationFrame(()=>{ sv.style.transition='opacity .9s ease'; sv.style.opacity=1; setTimeout(()=>$('pcv').style.opacity=0,950); });
}
async function intro(){
  await new Promise(r=>setTimeout(r,500));
  try{ await grow(); }catch(e){ console.warn(e); }
  solidWithGlow();
  setTimeout(()=>{ // → [iPhone 18 Pro - 11]
    $('t12').classList.add('hide'); $('t11').classList.remove('hide'); $('p-strips').classList.add('hide');
    $('pbox').style.top='272px';
    setTimeout(()=>['p-grad','p-txt','b-shoot'].forEach(i=>$(i).classList.remove('hide')),350);
  }, CFG.hold*1000);
}

/* ---------- 카메라 화면: 그리드별 배치 (박스 기준 좌표 = 피그마 - (16,119)) ---------- */
const BX=16, BY=119, CW=370, CH=600;
const LAY={ // [그리드 고쳐야함 1] 5×5 · [2-1/2-2] 2×2·3×3 · [3] 1×5
  '5x5':{tag:[120,152,151,27], pat:[77,368,244,249]},
  '3x3':{pat:[140,321,113,105], tag:[140,442,113,20]},
  '2x2':{pat:[140,321,113,105], tag:[140,442,113,20]},
  '1x5':{tag:[120,152,151,27], pat:[43,390,315,37]},
  'none':{tag:[120,152,151,27], pat:[43,390,315,49]},
};
function tagSVG(x,y,w,h,col){ const B=BRAND.tag,[bx,by,bw,bh]=B.bb;
  return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${bx} ${by} ${bw} ${bh}" preserveAspectRatio="xMidYMid meet"><path fill="${col}" d="${B.d}"/></svg>`; }
function overlaySVG(col){ const L=LAY[GRID]; const [px,py,pw,ph]=L.pat, [tx,ty,tw,th]=L.tag;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${CW} ${CH}" width="${CW}" height="${CH}">`+
    tagSVG(tx-BX,ty-BY,tw,th,col)+
    `<svg x="${px-BX}" y="${py-BY}" width="${pw}" height="${ph}" viewBox="0 0 ${PAT.w.toFixed(1)} ${PAT.h.toFixed(1)}" preserveAspectRatio="xMidYMid meet"><g fill="${col}" fill-rule="evenodd">${PAT.inner}</g></svg></svg>`; }

/* ---------- 스티커 ---------- */
const domeInner=`<path transform="${DOME_T}" d="${DOME.d}"/>`;
function stickerSVG(id){ // #fcf1c2 돔 위에 카카오색 그래픽
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 -500 1000 1000"><g fill="${CFG.YELLOW}">${domeInner}</g><g transform="scale(.76)" fill="${CFG.INK}" fill-rule="evenodd"><path d="${SH[id].d}"/></g></svg>`; }
let STK=null; // [{id,x,y,s,el}]
function initStickers(){
  const base=CFG.sticker.base, list=GFXS.map(g=>({id:g.id,s:base*(g.big?CFG.sticker.big:1)}));
  // 그리드처럼 배치: POD/QUICK(큰 것) 윗줄, 테이크어웨이 아랫줄 (2×2는 두 줄)
  const bigs=list.filter(o=>o.s>base), sm=list.filter(o=>o.s<=base);
  const rows=[]; if(bigs.length) rows.push(bigs); const per=GRID==='2x2'?2:3; for(let i=0;i<sm.length;i+=per) rows.push(sm.slice(i,i+per));
  const gap=14; const hs=rows.map(r=>Math.max(...r.map(o=>o.s))); const tot=hs.reduce((a,b)=>a+b,0)+gap*(rows.length-1);
  let y=Math.max(70, 270-tot/2);
  rows.forEach((r,ri)=>{ const w=r.reduce((a,o)=>a+o.s,0)+gap*(r.length-1); let x=CW/2-w/2; r.forEach(o=>{ o.x=x+o.s/2; o.y=y+hs[ri]/2; x+=o.s+gap; }); y+=hs[ri]+gap; });
  STK=list;
  $('stk').innerHTML=''; STK.forEach((o,i)=>{ const el=document.createElement('div'); el.className='st'; el.innerHTML=stickerSVG(o.id)+'<i class="hd"></i>'; o.el=el; $('stk').appendChild(el); place(o); });
}
document.addEventListener('animationend',e=>{ if(e.target.classList&&e.target.classList.contains('pop')) e.target.classList.remove('pop'); });
function place(o){ const t=`translate(${(o.x-o.s/2).toFixed(1)}px,${(o.y-o.s/2).toFixed(1)}px)`; o.el.style.setProperty('--t',t); o.el.style.transform=t; o.el.style.width=o.el.style.height=o.s+'px'; }
let SEL=null; function select(o){ if(SEL&&SEL!==o) SEL.el.classList.remove('sel'); SEL=o; if(o){ o.el.classList.add('sel'); $('stk').appendChild(o.el); STK.splice(STK.indexOf(o),1); STK.push(o);} }
// 터치: 한 손가락 = 이동, 두 손가락 = 크기, 오른쪽 아래 동그라미 = 크기
const pts=new Map(); let G=null;
const loc=e=>{ const r=$('cbox').getBoundingClientRect(); return [(e.clientX-r.left)/SC,(e.clientY-r.top)/SC]; };
function startG(){ const a=[...pts.values()]; if(!SEL) return; G={x:SEL.x,y:SEL.y,s:SEL.s,a:a.map(p=>p.slice()),d:a.length>1?Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]):0}; }
$('stk').addEventListener('pointerdown',e=>{
  if(MODE!=='sticker') return; const el=e.target.closest('.st'); hideHint();
  if(!el){ if(!pts.size) select(null); if(SEL){ pts.set(e.pointerId,loc(e)); startG(); } return; }
  const o=STK.find(s=>s.el===el); if(!pts.size||SEL!==o) select(o);
  e.preventDefault(); try{ $('stk').setPointerCapture(e.pointerId);}catch(_){}
  pts.set(e.pointerId,loc(e)); G=null; startG(); if(e.target.classList.contains('hd')) G.handle=true;
});
$('stk').addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)||!SEL||!G) return; pts.set(e.pointerId,loc(e)); const a=[...pts.values()];
  if(G.handle&&a.length===1){ const [x,y]=a[0]; SEL.s=Math.min(320,Math.max(36,2*Math.max(Math.abs(x-SEL.x),Math.abs(y-SEL.y))-6)); }
  else if(a.length>1&&G.d){ const d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]); SEL.s=Math.min(320,Math.max(36,G.s*d/G.d));
    const cx=(a[0][0]+a[1][0])/2-(G.a[0][0]+G.a[1][0])/2, cy=(a[0][1]+a[1][1])/2-(G.a[0][1]+G.a[1][1])/2; SEL.x=G.x+cx; SEL.y=G.y+cy; }
  else if(a.length===1&&G.a.length===1){ SEL.x=G.x+a[0][0]-G.a[0][0]; SEL.y=G.y+a[0][1]-G.a[0][1]; }
  SEL.x=Math.min(CW,Math.max(0,SEL.x)); SEL.y=Math.min(CH,Math.max(0,SEL.y)); place(SEL); });
const up=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); G=null; if(pts.size) startG(); };
$('stk').addEventListener('pointerup',up); $('stk').addEventListener('pointercancel',up);
function hideHint(){ $('hint').classList.add('hide'); }

/* ---------- 모드: Yellow / Cacao / Sticker ---------- */
let MODE='yellow', hintT;
function setMode(m){
  MODE=m; document.querySelectorAll('.seg').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  if(m==='sticker'){
    $('ovl').style.opacity=0; if(!STK) initStickers();
    $('stk').style.pointerEvents='auto';
    STK.forEach((o,i)=>{ o.el.classList.remove('pop'); o.el.style.opacity=0; setTimeout(()=>{ o.el.style.opacity=''; void o.el.offsetWidth; o.el.classList.add('pop'); },120+i*140); });
    $('hint').classList.remove('hide'); clearTimeout(hintT); hintT=setTimeout(hideHint,5000);
  } else {
    $('ovl').innerHTML=overlaySVG(m==='yellow'?CFG.YELLOW:CFG.INK); $('ovl').style.opacity=1;
    if(STK){ select(null); STK.forEach(o=>{o.el.classList.remove('pop'); o.el.style.opacity=0;}); }
    $('stk').style.pointerEvents='none'; hideHint();
  }
}
document.querySelectorAll('.seg').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

/* ---------- 카메라 ---------- */
let stream=null;
async function startCam(){
  $('nocam').style.display='none';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ return noCam('이 브라우저에서는 카메라를 열 수 없어요','사파리나 크롬으로 열어주세요'); }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1920}},audio:false});
    const v=$('vid'); v.srcObject=stream; $('pick').hidden=true; v.hidden=false; await v.play().catch(()=>{});
  }catch(e){ noCam('카메라를 열 수 없어요', /NotAllowed|Permission/i.test(e.name)?'카메라 권한을 허용하거나, 사진을 골라주세요':'인스타·카카오톡 안이라면 사파리로 열어주세요'); }
}
function noCam(m,s){ $('nocam').style.display='flex'; $('nc-msg').textContent=m; $('nc-sub').textContent=s; }
$('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const p=$('pick'); p.src=URL.createObjectURL(f); p.hidden=false; $('vid').hidden=true; $('nocam').style.display='none'; });
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

/* ---------- 촬영 ---------- */
function cover(ctx,src,sw,sh,W,H){ const s=Math.max(W/sw,H/sh), dw=sw*s, dh=sh*s; ctx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh); }
let lastBlob=null, lastURL=null;
async function shoot(){
  const K=3, W=CW*K, H=CH*K; const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#e9e9e9'; x.fillRect(0,0,W,H);
  const v=$('vid'), p=$('pick');
  if(!p.hidden&&p.naturalWidth) cover(x,p,p.naturalWidth,p.naturalHeight,W,H);
  else if(v.videoWidth) cover(x,v,v.videoWidth,v.videoHeight,W,H);
  let svg;
  if(MODE==='sticker'){ svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${CW} ${CH}">`+STK.filter(o=>o.el.style.opacity!=='0').map(o=>stickerSVG(o.id).replace('<svg ',`<svg x="${(o.x-o.s/2).toFixed(1)}" y="${(o.y-o.s/2).toFixed(1)}" width="${o.s.toFixed(1)}" height="${o.s.toFixed(1)}" `)).join('')+'</svg>'; }
  else svg=overlaySVG(MODE==='yellow'?CFG.YELLOW:CFG.INK);
  try{ const im=await svgImg(svg.replace(/^<svg ([^>]*?)width="\d+" height="\d+"/,'<svg $1'),W,H); x.drawImage(im,0,0,W,H); }catch(e){ console.warn(e); }
  const f=$('flash'); f.style.transition='none'; f.style.opacity=.85; requestAnimationFrame(()=>{ f.style.transition='opacity .5s'; f.style.opacity=0; });
  lastBlob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92)); if(lastURL) URL.revokeObjectURL(lastURL); lastURL=URL.createObjectURL(lastBlob);
  $('rimg').src=lastURL; $('rbg').src=lastURL;
  setTimeout(()=>{ go('s-res'); stopCam(); },250);
}
$('shutter').addEventListener('click',shoot);
$('b-again').addEventListener('click',()=>{ go('s-cam'); if($('pick').hidden) startCam(); });
$('b-save').addEventListener('click',async()=>{
  if(!lastBlob) return; const name=`nooc-${Date.now()}.jpg`; const file=new File([lastBlob],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const a=document.createElement('a'); a.href=lastURL; a.download=name; document.body.appendChild(a); a.click(); a.remove();
});
$('b-shoot').addEventListener('click',()=>{ go('s-cam'); setMode('yellow'); startCam(); });

intro();
</script>
